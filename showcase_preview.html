<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #111421; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.social-showcase{padding:48px 24px 40px;border-top:1px solid rgba(255,255,255,0.06);width:100%;}
.social-showcase-cards{position:relative;max-width:960px;height:460px;margin:0 auto 40px;}
.showcase-card{position:absolute;width:18%;background:#fff;border-radius:8px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,0.3);}
.showcase-card-center{width:20%;}
.showcase-thumb{width:100%;aspect-ratio:9/16;border-radius:4px;position:relative;overflow:hidden;}
.showcase-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;background:rgba(255,255,255,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.showcase-play-lg{width:40px;height:40px;}
.showcase-play-tri{display:block;width:0;height:0;border-left:11px solid #333;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px;}
.showcase-views{position:absolute;bottom:8px;left:8px;display:flex;align-items:center;gap:4px;color:#fff;font-family:'Figtree',sans-serif;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.6);}
.social-showcase-icons{display:flex;justify-content:center;gap:40px;}
.showcase-icon-link{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;}
.showcase-icon-circle{width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;transition:border-color 0.2s;}
.showcase-icon-link span{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:0.1em;text-transform:uppercase;}
</style>
</head>
<body>

</body>
</html>
