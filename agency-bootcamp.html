<style id="page-css">
/* Layout: a single white document page on a light desk, editorial doc treatment in Blueprint navy and blue (deliberately single light theme) */
:root{
  --desk:#f8f9fa; --page:#ffffff; --ink:#202124; --head:#16213d; --text:#3c4043; --muted:#5f6368;
  --gold:#2868d5; --gold-deep:#253662; --gold-link:#1f56b8; --gold-soft:#eaf1fc; --rule:#e8eaed; --cell:#d9d9d9; --zebra:#f7f9fc; --thead:#253662;
  --green:#16a34a; --green-deep:#15803d; --warn:#a3360d; --warn-soft:#fbe9e2;
  --f-body:"Inter",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);line-height:1.7;-webkit-font-smoothing:antialiased}
.toolbar{max-width:816px;margin:22px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:#6b6d70;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toolbar:empty{display:none}
.toolbar-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.status.dirty{color:var(--gold-link);font-weight:600}
.toolbar button{font:inherit;background:transparent;border:1px solid #d7d6d3;border-radius:3px;color:var(--muted);padding:6px 10px;cursor:pointer}
.toolbar button:hover{background:#eef2f8}
.toolbar button.primary{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff}
.toolbar button:disabled{opacity:.45;cursor:default;background:transparent;color:var(--muted);border-color:#d7d6d3}
.toolbar button:focus-visible,.mini:focus-visible,.x:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.editing .toolbar [data-act=toggle]{background:var(--gold-soft);border-color:var(--gold)}
.page-wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:816px;margin:18px auto 40px;padding:72px 96px 80px;background:var(--page);box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);border-radius:2px}
.doc-header{padding-bottom:27px;margin-bottom:36px;border-bottom:2px solid var(--gold)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap}
.brand{display:flex;align-items:center;flex:none}
.brand svg{display:block;height:48px;width:auto;max-width:100%}
.doc-meta{white-space:pre-line;font-size:12px;line-height:1.65;color:var(--muted);text-align:right;margin:0}
h1{font-size:28px;font-weight:700;color:var(--head);line-height:1.3;margin:0 0 15px;letter-spacing:-.015em}
h2{font-size:20px;font-weight:600;color:var(--head);line-height:1.35;margin:44px 0 13px;padding-bottom:7px;border-bottom:1px solid var(--rule);text-wrap:balance}
h3{font-size:16px;font-weight:600;color:var(--head);line-height:1.45;margin:23px 0 8px}
p,li{font-size:14.5px;color:var(--text)}
p{margin:0 0 14px}
strong{font-weight:600;color:var(--ink)}
.emphasis{border-left:3px solid var(--gold);padding:8px 0 8px 16px;margin:18px 0 23px;color:var(--ink)}
ul{padding-left:21px;margin:10px 0 18px}
li{margin:0 0 6px}
li::marker{color:var(--gold-deep)}
.day-meta{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.day-meta b{font-weight:600;color:var(--ink)}
.group-lab{font-size:14.5px;font-weight:600;color:var(--head);margin:20px 0 6px}
.tbl{overflow-x:auto;margin:16px 0 20px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--cell);padding:10px 13px;text-align:left;vertical-align:top;line-height:1.5}
thead{background:var(--thead);color:#fff}
thead th{font-weight:600;font-size:13px}
tbody tr:nth-child(even){background:var(--zebra)}
tfoot{background:var(--gold-soft);color:var(--head)}
tfoot td{font-weight:600}
tfoot.off{background:var(--warn-soft);color:var(--warn)}
td.min,th.min{width:72px;white-space:nowrap;font-variant-numeric:tabular-nums}
td.min{color:var(--gold-link);font-weight:600}
td.act,th.act{width:40px;text-align:center}
th.date,td.date{width:128px}
th.theme{width:30%}
td.date a{color:var(--gold-link);text-decoration:underline;text-underline-offset:3px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.blocks td:nth-child(1){width:36%}
.blocks td:nth-child(1) strong{display:block}
.who{display:inline-block;font-size:11.5px;font-weight:600;color:var(--gold-link);background:var(--gold-soft);border-radius:3px;padding:0 6px;margin-top:3px}
.note{font-size:13px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0 8px}
.person{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:start;min-width:0}
.pbody{min-width:0}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;background:var(--gold-soft)}
.avatar.ini{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--gold-deep);border:2px solid var(--gold)}
.person .pname{font-weight:600;color:var(--head);font-size:15px}
.person ul.pbio{margin:6px 0 0;padding-left:18px}
.person ul.pbio li{font-size:13.5px;margin:0 0 4px}
.person ul.pbio b{font-weight:600;color:var(--gold-deep)}
.person .prole{font-size:13px;color:var(--muted);margin-top:2px}
.person .pteach{font-size:13.5px;color:var(--text);margin-top:6px}
.person .pteach b{font-weight:600;color:var(--gold-deep)}
@media(max-width:600px){.people{grid-template-columns:1fr}}
.sources a{color:var(--gold-link);text-decoration:underline;text-underline-offset:3px}
.sources li{font-size:13.5px}
.doc-footer{display:flex;justify-content:space-between;gap:20px;margin-top:40px;padding-top:17px;border-top:1px solid var(--rule);font-size:11px;line-height:1.5;color:#777}
.mini{font:600 12px var(--f-body);border:1px dashed var(--gold);background:transparent;color:var(--gold-link);border-radius:3px;padding:4px 10px;cursor:pointer}
.mini:hover{background:var(--gold-soft)}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:3px}
.x:hover{color:var(--warn);background:var(--warn-soft)}
.adds{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 18px}
[contenteditable=true]{outline:1px dashed var(--gold);outline-offset:3px;cursor:text;min-width:1ch}
[contenteditable=true]:focus{outline:2px solid var(--gold)}
[contenteditable=true]:empty::before{content:"Add text";color:#9aa0a6}

.price-tbl td.plan,.price-tbl th.plan{width:150px;text-align:center}
.price-tbl td.plan{font-size:13px;color:var(--text)}
.yes{color:var(--gold);font-weight:700;font-size:16px}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:22px 0 8px}
.plan-card{border:1px solid var(--cell);border-top:4px solid var(--gold);border-radius:4px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.plan-card.featured{border-top-color:var(--gold-deep)}
.plan-name{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plan-price{font-size:32px;font-weight:700;color:var(--head);line-height:1.2}
.plan-note{font-size:13.5px;color:var(--text)}
.cta{display:inline-block;margin-top:10px;text-align:center;font:600 14px var(--f-body);text-decoration:none;padding:11px 16px;border-radius:4px;background:var(--green);color:#fff}
.cta:hover{background:var(--green-deep)}
.cta.soon{background:var(--gold-soft);color:var(--gold-link);cursor:default}
.url-edit{font-size:12px;color:var(--muted);margin-top:8px;word-break:break-all}
@media(max-width:600px){.plans{grid-template-columns:1fr}.price-tbl td.plan,.price-tbl th.plan{width:96px}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--page)}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--page);border-bottom:1px solid var(--rule);box-shadow:0 1px 6px rgba(22,33,61,.06);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topnav-in{max-width:816px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:10px}
.topnav .mark{flex:none;display:flex}

.topnav .links{display:flex;gap:18px;flex:1;min-width:0;justify-content:center;flex-wrap:wrap}
.topnav .links a{font-size:13px;font-weight:500;color:var(--text);text-decoration:none}
.topnav .links a:hover{color:var(--gold)}

section{scroll-margin-top:72px}
@media(max-width:760px){.topnav .links{display:none}.topnav-in{justify-content:space-between}.topnav .mark svg{height:28px}}

.bul{padding-left:21px;margin:12px 0 20px}
.bul li{margin:0 0 7px}
.video{margin:26px 0 8px}
.video-box{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--gold-deep);border-radius:4px;overflow:hidden}
.video-box wistia-player{position:absolute;inset:0;display:block;z-index:2}
.video-box wistia-player:not(:defined){display:none}
.video-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-decoration:none;font-weight:600;font-size:15px;z-index:1}
.video-fallback .play{width:72px;height:72px;border-radius:50%;background:var(--gold);position:relative}
.video-fallback .play::after{content:"";position:absolute;left:29px;top:22px;border-style:solid;border-width:14px 0 14px 22px;border-color:transparent transparent transparent #fff}
.video-fallback:hover .play{background:#fff}.video-fallback:hover .play::after{border-left-color:var(--gold)}

.plans-banner{margin:26px 0 -6px;text-align:center;font-size:17px;font-weight:700;color:var(--gold-deep);background:var(--gold-soft);border-radius:4px;padding:10px 14px}
.plan-card{position:relative}
.plans{align-items:stretch}
.plan-card .cta{margin-top:auto}
.plan-card .plan-note{margin-bottom:14px}

.was{color:var(--muted);font-weight:500;font-size:.6em;margin-right:4px}

.faq{border-top:1px solid var(--rule);margin-top:10px}
.faq-item{border-bottom:1px solid var(--rule);padding:4px 0}
.faq-item summary{cursor:pointer;list-style:none;font-weight:600;color:var(--head);font-size:15px;padding:12px 28px 12px 0;position:relative}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:"+";position:absolute;right:4px;top:8px;font-size:22px;font-weight:400;color:var(--gold)}
.faq-item[open] summary::after{content:"\2212"}
.faq-item p{margin:0 0 14px;max-width:68ch}
.faq-item summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.faq-q{font-weight:600;color:var(--head);margin:10px 0 4px}.faq-a{margin-bottom:8px}
@media(max-width:860px){.page{padding:48px 54px 60px}}
@media(max-width:600px){.brand svg{height:40px}.toolbar{align-items:flex-start;flex-direction:column;gap:8px}.page-wrap{padding-left:0;padding-right:0}.page{margin:13px 0 0;padding:32px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));box-shadow:none;border-radius:0}.doc-meta{text-align:left}h1{font-size:25px}p,li{font-size:15px}th,td{padding:9px 9px;font-size:13px}.doc-footer{flex-direction:column;gap:6px}}
</style>

ecting, quality checks, acquisition and vendor QC, ending with the SEO sprint backlog."},{"day":"Thu, Dec 10","theme":"The Paid Model (LSAs + PPC)","ms":"LSAs and PPC run in house, managed by a sub you vet and audit with AI."},{"day":"Fri, Dec 11","theme":"Reporting, retention and the 30-day plan","ms":"Blended reporting, AI-prepared updates, client communication, retention and your 30-day plan."}],"prework":{"intro":"Students finish this before Session 1. It isn't a live session: it gets every account working so live time goes to teaching. The core stack costs about $355/mo, plus $24.99/mo for Local Falcon if you offer local SEO, and ad spend.","checklist":["Create every account in the tool stack below","Connect Agency OS to Claude and link GSC, GA4, GBP, Google Ads and LSAs","Run one test prompt and one test Agency OS pull","Post an intro in the community","Join setup office hours if anything breaks"],"tools":[{"tool":"Blueprint membership (includes Agency OS)","use":"Pipeline, proposals, WQA, local tool and reporting (all days)","level":"Membership","price":"$199/mo"},{"tool":"Claude","use":"AI work, the Agency OS connector and the site build (all days)","level":"Pro minimum, Max for heavy daily use","price":"Pro $20/mo ($17/mo billed yearly), Max from $100/mo"},{"tool":"Google Workspace","use":"Business email and the login behind every Google tool (pre-work)","level":"Business Starter","price":"$7/user/mo yearly, $8.40 flexible"},{"tool":"Netlify or Vercel","use":"Hosting the agency site (Session 2)","level":"Netlify Free or Personal; Vercel Pro, since Hobby is non-commercial only","price":"Netlify $0 to $9/mo, Vercel $20/mo"},{"tool":"GitHub","use":"Storing and deploying the site code (Session 2)","level":"Free","price":"$0"},{"tool":"Meta Business Suite and Ads Manager","use":"Running Facebook ads (Session 3)","level":"Free account","price":"$0 plus ad spend"},{"tool":"Google Search Console, GA4, Google Business Profile","use":"Baselines, the WQA, local and reporting (Sessions 4 to 10)","level":"Free","price":"$0"},{"tool":"Google Ads and LSAs","use":"Paid search and LSAs (Session 9)","level":"Free account","price":"$0 plus ad spend"},{"tool":"Ahrefs or Semrush","use":"Keyword, competitor and link research (Sessions 5, 7 and 8)","level":"Ahrefs Lite or Semrush Pro","price":"Ahrefs $129/mo, Semrush $139.95/mo"},{"tool":"DataForSEO","use":"SEO data through the API: SERPs, keywords and rankings for AI workflows","level":"Pay as you go","price":"$50 minimum top-up, then usage-based"},{"tool":"Local Falcon (required if you offer local SEO)","use":"Map pack grid rank tracking for local clients (Session 6)","level":"Starter","price":"$24.99/mo"}],"note":"Core stack: membership, Claude Pro, Workspace, Ahrefs Lite and Netlify Free. Add Local Falcon for local SEO clients."},"days":[{"num":"1","title":"Agency Foundations","lead":"Ryan + David","target":120,"groups":[{"label":"The business (Ryan)","blocks":[{"n":"Where AI is now, and what it does to agencies and search","m":15,"w":"","d":"Models went from chatting to doing work, and the headcount model breaks. Live demo: a full search presence pull on a prospect, then take apart the blended results page (LSAs, ads, map pack, organic, AI answers)."},{"n":"Where you fit and the operating model","m":10,"w":"","d":"You, plus AI, plus subs. Customer, problem, offer, delivery and management, mapped to the bootcamp days."},{"n":"Niche, ideal client and the blended offer","m":25,"w":"","d":"Depth beats breadth, using law firms as the case study. The foundational sprint, ongoing SEO and local, plus paid and LSAs run by subs, with pricing, margins and proof."}]},{"label":"The AI stack (David + Ryan)","blocks":[{"n":"Models, context, prompts and QC","m":15,"w":"David","d":"Why better context means better output. Nothing goes out unchecked."},{"n":"Agents, tools, MCP and skills","m":20,"w":"David","d":"How they connect and how the opening demo worked. Live build: connect a tool and run a skill. at put your clients at the top of the page and drive calls from day one","Running profitable Google PPC campaigns through a vetted subcontractor, without becoming a media buyer yourself","Reporting clients understand, retention, and your 30-day plan to put it all to work"],"video":"y4fl9ypir2","lede2":"The One Person Agency is a 10 day bootcamp giving you a complete roadmap to ensure your agency continues to thrive in the coming years.","faq":[{"q":"What if I can't make the live sessions?","a":"Every session is recorded and added to a private training platform, so you can catch up on your own time. You keep access to the recordings after the bootcamp ends."},{"q":"Who is this for?","a":"Agency owners and freelancers who sell SEO and want to run a lean, AI-powered agency. We use a law firm as the example client, but the process works for any local service business."},{"q":"Do I need to be technical?","a":"No. The pre-work walks you through setup, office hours help if you get stuck, and Session 1 covers AI foundations from the ground up."},{"q":"What tools do I need?","a":"You'll get the full tool list and a setup checklist before Session 1. The core stack runs about $355/mo, plus Local Falcon if you offer local SEO."},{"q":"I'm already a Blueprint member. How do I join?","a":"The bootcamp is included in your membership. Sign up for it inside Skool."},{"q":"What happens after my free month of Agency OS?","a":"Become a Blueprint member to keep using Agency OS, along with the coaching calls, the community and every future bootcamp."},{"q":"How long is early bird pricing available?","a":"For a limited time. After that, the bootcamp goes back to its regular price of $799."}],"showPrework":false}</script>

      var foot="";
      return ((multi||g.label||editing)&&(g.label||editing)?ed(gb+"label","div","group-lab"):"")+
        "<div class=\"tbl\"><table class=\"blocks\"><thead><tr><th>Block</th><th>What's covered</th>"+xHead()+"</tr></thead><tbody>"+rows+"</tbody>"+foot+"</table></div>"+
        (editing?"<div class=\"adds\">"+act("addBlock",i+","+j,"+ Add block")+"</div>":"");
    }).join("");
    return "<section id=\"day-"+esc(d.num)+"\"><h2>Session "+ed(b+"num")+": "+ed(b+"title")+"</h2><p class=\"day-meta\"><b>When:</b> "+ed(b+"when")+" &nbsp;·&nbsp; <b>Lead:</b> "+ed(b+"lead")+"</p>"+groups+"</section>";
  }
  function cell(p,v){return (!editing&&String(v).toLowerCase()==="yes")?"<span class=\"yes\" aria-label=\"Included\">&#10003;</span>":ed(p);}
  function planCard(key,featured){var c=S.pricing[key],b="pricing."+key+".";
    var btn=editing?"":(c.url?"<a class=\"cta\" href=\""+esc(c.url)+"\" target=\"_blank\" rel=\"noopener noreferrer\">"+esc(c.label)+"</a>":"<span class=\"cta soon\">"+esc(c.label)+"</span>");
    return "<div class=\"plan-card"+(featured?" featured":"")+"\">"+((c.badge||editing)&&c.badge!=null?ed(b+"badge","div","plan-badge"):"")+ed(b+"plan","div","plan-name")+"<div class=\"plan-price\">"+((c.was&&!editing)?"<s class=\"was\">"+esc(c.was)+"</s> ":"")+(editing&&c.was!=null?"<span class=\"was\">Was: "+ed(b+"was")+"</span> ":"")+ed(b+"price")+"</div>"+ed(b+"note","div","plan-note")+btn+
      (editing?"<div class=\"url-edit\">Button text: "+ed(b+"label")+"<br>Link: "+ed(b+"url")+"</div>":"")+"</div>";}
  function renderPricing(){
    var P=S.pricing;if(!P)return "";
    var rows=P.rows.map(function(r,i){var b="pricing.rows."+i+".";
      return "<tr><td>"+ed(b+"f")+"</td><td class=\"plan\">"+cell(b+"m",r.m)+"</td><td class=\"plan\">"+cell(b+"n",r.n)+"</td>"+xCell("delPrice",i)+"</tr>";}).join("");
    return "<section id=\"pricing\"><h2>Pricing and Sign-Up</h2>"+ed("pricing.intro","p")+
      "<div class=\"tbl\"><table class=\"price-tbl\"><thead><tr><th>What's included</th><th class=\"plan\">Blueprint members</th><th class=\"plan\">Everyone else</th>"+xHead()+"</tr></thead><tbody>"+rows+
      "</tbody><tfoot><tr><td>Bootcamp price</td><td class=\"plan\">Free</td><td class=\"plan\">"+(P.public.was?"<s class=\"was\">"+esc(P.public.was)+"</s> ":"")+esc(P.public.price)+"</td>"+(editing?"<td></td>":"")+"</tr></tfoot></table></div>"+
      (editing?"<div class=\"adds\">"+act("addPrice","","+ Add row")+"</div>":"")+
      (P.banner!=null?ed("pricing.banner","div","plans-banner"):"")+"<div class=\"plans\">"+planCard("member",false)+planCard("public",true)+"</div></section>";
  }
  function renderFaq(){var L=S.faq||[];if(!L.length&&!editing)return "";
    return "<section id=\"faq\"><h2>Frequently Asked Questions</h2><div class=\"faq\">"+L.map(function(x,i){var b="faq."+i+".";
      return editing?"<div class=\"faq-item\">"+ed(b+"q","div","faq-q")+ed(b+"a","div","faq-a")+act("delFaq",i,"Remove question")+"</div>"
        :"<details class=\"faq-item\"><summary>"+esc(x.q)+"</summary><p>"+esc(x.a)+"</p></details>";}).join("")+"</div>"+
      (editing?"<div class=\"adds\" style=\"margin-top:10px\">"+act("addFaq","","+ Add question")+"</div>":"")+"</section>";}
  function renderSources(){
    return "<section class=\"sources\" id=\"sources\"><h2>Sources</h2>"+ed("sources.asof","p","note")+"<ul>"+
      S.sources.links.map(function(l){return "<li><a href=\""+esc(l.u)+"\" target=\"_blank\" rel=\"noopener noreferrer\">"+esc(l.t)+"</a></li>";}).join("")+"</ul></section>";
  }
  function render(){
    var y=window.scrollY;
    app.className=editing?"editing":"";
    app.innerHTML="<nav class=\"topnav\" aria-label=\"Page\"><div class=\"topnav-in\"><a class=\"mark\" href=\"#top\" aria-label=\"Back to top\">"+LOGO+"</a><div class=\"links\"><a href=\"#learn\">What You'll Learn</a><a href=\"#overview\">Schedule</a><a href=\"#instructors\">Instructors</a><a href=\"#day-1\">Outline</a><a href=\"#pricing\">Pricing</a><a href=\"#faq\">FAQ</a></div><a class=\"reserve\" href=\"#pricing\">Reserve Your Spot</a></div></nav>"+"<div class=\"toolbar\" id=\"bar\" aria-label=\"Document tools\">"+renderBar()+"</div><div class=\"page-wrap\"><main class=\"page\">"+
      "<header class=\"doc-header\" id=\"top\"><div class=\"brand-row\"><div class=\"brand\">"+LOGO+"</div>"+ed("meta","p","doc-meta")+"</div></header>"+
      ed("title","h1")+ed("lede","p")+(S.lede2!=null?ed("lede2","p"):"")+
      renderVideo()+renderLearn()+renderOverview()+renderInstructors()+(S.showPrework===false?"":renderPrework())+S.days.map(renderDay).join("")+renderPricing()+renderFaq()+
      "<footer class=\"doc-footer\"><span>The Blueprint Training</span><span>November 2026</span></footer></main></div>";
    window.scrollTo(0,y);
  }
  function refreshBar(){var bar=document.getElementById("bar");if(bar)bar.innerHTML=renderBar();}
  function markDirty(){if(!dirty){dirty=true;msg="";refreshBar();}}

  app.addEventListener("input",function(e){
    var el=e.target.closest("[data-p]");if(!el)return;
    var p=el.getAttribute("data-p");var v=el.textContent;
    if(/\.m$/.test(p)||/\.target$/.test(p)){v=parseInt(v,10);if(isNaN(v))v=0;}
    put(p,v);markDirty();
    var m=p.match(/^days\.(\d+)\./);
    if(m){var i=+m[1];var chip=app.querySelector("[data-total=\""+i+"\"]");if(chip)chip.outerHTML=footRow(S.days[i],i);}
  });
  app.addEventListener("keydown",function(e){
    var el=e.target.closest("[contenteditable]");if(el&&e.key==="Enter"){e.preventDefault();el.blur();}
  });
  app.addEventListener("paste",function(e){
    var el=e.target.closest("[contenteditable]");if(!el)return;e.preventDefault();
    var t=(e.clipboardData||window.clipboardData).getData("text/plain").replace(/\s+/g," ");
    var sel=window.getSelection();if(!sel.rangeCount)return;var r=sel.getRangeAt(0);r.deleteContents();r.insertNode(document.createTextNode(t));r.collapse(false);
    el.dispatchEvent(new Event("input",{bubbles:true}));
  });
  app.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");if(!b)return;
    var a=b.getAttribute("data-act"),args=(b.getAttribute("data-args")||"").split(",").map(Number);
    if(a==="toggle"){editing=!editing;render();return;}
    if(a==="save"){save();return;}
    if(a==="addBlock"){S.days[args[0]].groups[args[1]].blocks.push({n:"New block",m:15,w:"",d:""});}
    else if(a==="delBlock"){S.days[args[0]].groups[args[1]].blocks.splice(args[2],1);}
    else if(a==="addCheck"){S.prework.checklist.push("New item");}
    else if(a==="delCheck"){S.prework.checklist.splice(args[0],1);}
    else if(a==="addTool"){S.prework.tools.push({tool:"New tool",use:"",level:"",price:""});}
    else if(a==="delTool"){S.prework.tools.splice(args[0],1);}
    else if(a==="addRow"){S.overview.push({day:"",theme:"New row",ms:""});}
    else if(a==="delRow"){S.overview.splice(args[0],1);}
    else if(a==="photo"){pickFor=args[0];picker.value="";picker.click();return;}
    else if(a==="nophoto"){delete S.instructors[args[0]].photo;}
    else if(a==="addFmt"){S.formatList.push("New bullet");}
    else if(a==="delFmt"){S.formatList.splice(args[0],1);}
    else if(a==="addLearn"){S.learn.push("New bullet");}
    else if(a==="delLearn"){S.learn.splice(args[0],1);}
    else if(a==="addFaq"){(S.faq=S.faq||[]).push({q:"New question",a:"Answer"});}
    else if(a==="delFaq"){S.faq.splice(args[0],1);}
    else if(a==="addPrice"){S.pricing.rows.push({f:"New item",m:"yes",n:"yes"});}
    else if(a==="delPrice"){S.pricing.rows.splice(args[0],1);}
    else if(a==="addPerson"){(S.instructors=S.instructors||[]).push({name:"Name",role:"Role",teaches:""});}
    else if(a==="delPerson"){S.instructors.splice(args[0],1);}
    else return;
    markDirty();render();
  });


  function shrink(file){return new Promise(function(res){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var k=Math.min(1,400/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b||file);},"image/jpeg",0.86);};
    img.onerror=function(){URL.revokeObjectURL(u);res(file);};img.src=u;});}
  picker.addEventListener("change",function(){
    var f=picker.files&&picker.files[0],i=pickFor;if(!f||i<0||!assets)return;
    msg="Uploading photo";refreshBar();
    shrink(f).then(function(b){return assets.upload(b);}).then(function(r){S.instructors[i].photo=r.id;msg="";markDirty();render();})
    .catch(function(){msg="Photo upload didn't go through. Try a JPG or PNG.";refreshBar();});
  });
  function buildDoc(){
    var st=document.head&&document.head.querySelector("style");
    var reset=(st&&st.textContent)||FALLBACK_RESET;
    var css=document.getElementById("page-css").textContent;
    var js=document.getElementById("page-js").textContent;
    var json=JSON.stringify(S).replace(/</g,"\\u003c");
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>"+reset+"</style></head><body>"+
      "<title>One-Person Agency Bootcamp</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\""+FONT_HREF+"\">\n"+
      "<style id=\"page-css\">"+css+"</style>\n"+(S.video?"<script src=\"https://fast.wistia.com/player.js\" async><\/script><script src=\"https://fast.wistia.com/embed/"+S.video+".js\" async type=\"module\"><\/script>\n":"")+"<div id=\"app\"></div>\n"+
      "<script type=\"application/json\" id=\"bootcamp-state\">"+json+"<\/script>\n"+
      "<script id=\"page-js\">"+js+"<\/script></body></html>";
  }
  function save(){
    if(!art||saving||!dirty)return;
    saving=true;refreshBar();
    art.publish(buildDoc()).then(function(){saving=false;dirty=false;msg="Saved";refreshBar();})
    .catch(function(err){
      saving=false;var c=err&&err.code;
      if(c==="conflict"){msg="Someone saved first. Loading their version.";}
      else if(["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].indexOf(c)>=0){readOnly=true;editing=false;dirty=false;msg="This view is read-only.";render();return;}
      else if(c==="rate_limited"){msg="Saving too often. Wait a moment, then save again.";}
      else if(c==="too_large"){msg="The page is too large to save. Remove some content and try again.";}
      else {msg="Save didn't go through. Try again in a moment.";}
      refreshBar();
    });
  }

  render();
  if(window.claude&&window.claude.use){
    Promise.all([window.claude.use("artifact"),window.claude.use("user"),window.claude.use("assets")]).then(function(r){
      art=r[0];var u=r[1];assets=r[2]||null;
      var can=u&&typeof u.canEdit==="function"?u.canEdit():null;
      readOnly=!art||can===false;
      render();
    }).catch(function(){readOnly=true;render();});
  }
})();
</script></body></html>
