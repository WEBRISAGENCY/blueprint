<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's Included cards — 10 options</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Figtree',sans-serif;color:#0B0E1A;background:#EDEEF2}
  .tag{max-width:1080px;margin:0 auto;padding:40px 24px 0}
  .tag h3{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#1E3A5F}
  .tag p{font-size:14px;color:#6B7280;margin-top:4px;max-width:760px}
  .card{max-width:1080px;margin:14px auto 0;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:44px 40px;box-shadow:0 14px 34px -22px rgba(15,23,42,.3)}
  .card.navy{background:#132c54}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  ul{list-style:none}
  svg{width:22px;height:22px}
  @media(max-width:820px){.g3{grid-template-columns:1fr}}

  /* O1 yellow top accent + lift */
  .o1 .c{background:#F7F8FA;border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:26px 24px;position:relative;overflow:hidden;transition:.25s}
  .o1 .c::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#F7C600;transform:scaleX(0);transform-origin:left;transition:.25s}
  .o1 .c:hover{transform:translateY(-5px);box-shadow:0 18px 36px -22px rgba(15,23,42,.35)}
  .o1 .c:hover::before{transform:scaleX(1)}
  .o1 .ic{width:46px;height:46px;border-radius:11px;background:#fff;border:1px solid rgba(0,0,0,.06);color:#1E3A5F;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .o1 .n{font-family:'Space Mono',monospace;font-size:12px;color:#c0a63a;font-weight:700;position:absolute;top:24px;right:24px}
  .o1 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
  .o1 p{font-size:13.5px;color:#6B7280;line-height:1.6;margin-bottom:14px}
  .o1 li{font-size:12.5px;color:#5b6472;padding-left:18px;position:relative;margin-bottom:6px}
  .o1 li::before{content:'✓';position:absolute;left:0;color:#c0a63a;font-weight:700}

  /* O2 ghost number */
  .o2 .c{background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:14px;padding:28px 24px;position:relative;overflow:hidden}
  .o2 .n{position:absolute;top:-14px;right:6px;font-family:'Anton',sans-serif;font-size:96px;color:rgba(15,23,42,.05);line-height:1}
  .o2 .ic{color:#1E3A5F;margin-bottom:16px}.o2 .ic svg{width:26px;height:26px}
  .o2 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
  .o2 p{font-size:13.5px;color:#6B7280;line-height:1.6}

  /* O3 horizontal icon-left */
  .o3 .c{display:flex;gap:16px;background:#F7F8FA;border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:22px}
  .o3 .ic{width:44px;height:44px;flex-shrink:0;border-radius:11px;background:#0B0E1A;color:#F7C600;display:flex;align-items:center;justify-content:center}
  .o3 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}
  .o3 p{font-size:13px;color:#6B7280;line-height:1.55}

  /* O4 dark navy cards */
  .o4 .c{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:26px 24px;transition:.25s}
  .o4 .c:hover{border-color:rgba(247,198,0,.5);transform:translateY(-4px)}
  .o4 .ic{width:46px;height:46px;border-radius:11px;background:rgba(247,198,0,.14);color:#F7C600;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .o4 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;color:#fff;margin-bottom:8px}
  .o4 p{font-size:13.5px;color:rgba(255,255,255,.6);line-height:1.6;margin-bottom:12px}
  .o4 li{font-size:12.5px;color:rgba(255,255,255,.72);padding-left:18px;position:relative;margin-bottom:6px}
  .o4 li::before{content:'✓';position:absolute;left:0;color:#F7C600;font-weight:700}

  /* O5 centered circle icon */
  .o5 .c{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:30px 22px;text-align:center;transition:.25s}
  .o5 .c:hover{box-shadow:0 16px 34px -22px rgba(15,23,42,.3);transform:translateY(-4px)}
  .o5 .ic{width:58px;height:58px;border-radius:50%;background:#F7C600;color:#0B0E1A;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .o5 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
  .o5 p{font-size:13px;color:#6B7280;line-height:1.6}

  /* O6 left yellow border + num badge */
  .o6 .c{background:#F7F8FA;border:1px solid rgba(0,0,0,.07);border-left:3px solid #F7C600;border-radius:0 12px 12px 0;padding:24px 22px;position:relative}
  .o6 .n{width:30px;height:30px;border-radius:8px;background:#0B0E1A;color:#F7C600;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .o6 .ic{display:none}
  .o6 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
  .o6 p{font-size:13.5px;color:#6B7280;line-height:1.6;margin-bottom:12px}
  .o6 li{font-size:12.5px;color:#5b6472;padding-left:16px;position:relative;margin-bottom:6px}
  .o6 li::before{content:'—';position:absolute;left:0;color:#c0a63a}

  /* O7 corner brackets */
  .o7 .c{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:4px;padding:26px 24px;position:relative}
  .o7 .c::before,.o7 .c::after{content:'';position:absolute;width:26px;height:26px;border:2px solid #F7C600}
  .o7 .c::before{top:8px;left:8px;border-right:none;border-bottom:none}
  .o7 .c::after{bottom:8px;right:8px;border-left:none;border-top:none}
  .o7 .ic{color:#1E3A5F;margin-bottom:14px}.o7 .ic svg{width:26px;height:26px}
  .o7 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
  .o7 p{font-size:13.5px;color:#6B7280;line-height:1.6}

  /* O8 gradient tile + num pill */
  .o8 .c{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:26px 24px;position:relative;box-shadow:0 10px 26px -20px rgba(15,23,42,.4)}
  .o8 .ic{width:50px;height:50px;border-radius:13px;background:linear-gradient(135deg,#FFDF63,#F5C400);color:#0B0E1A;display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 18px -8px rgba(247,198,0,.7)}
  .o8 .n{position:absolute;top:22px;right:22px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.1em;color:#0B0E1A;background:#EEF0F4;padding:3px 9px;border-radius:99px}
  .o8 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
  .o8 p{font-size:13.5px;color:#6B7280;line-height:1.6}

  /* O9 minimal divider rows */
  .o9 .list{border-top:1px solid rgba(0,0,0,.09)}
  .o9 .c{display:flex;gap:16px;align-items:flex-start;padding:22px 4px;border-bottom:1px solid rgba(0,0,0,.09)}
  .o9 .ic{width:40px;height:40px;flex-shrink:0;border-radius:10px;background:rgba(247,198,0,.15);color:#1E3A5F;display:flex;align-items:center;justify-content:center}
  .o9 .n{font-family:'Space Mono',monospace;font-size:12px;color:#b7bdca;font-weight:700;margin-left:auto;flex-shrink:0}
  .o9 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
  .o9 p{font-size:13px;color:#6B7280;line-height:1.55;max-width:520px}

  /* O10 elevated + arrow */
  .o10 .c{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:26px 24px;position:relative;transition:.25s;overflow:hidden}
  .o10 .c:hover{border-color:rgba(247,198,0,.5);box-shadow:0 20px 40px -24px rgba(15,23,42,.4)}
  .o10 .ic{width:46px;height:46px;border-radius:11px;background:rgba(247,198,0,.15);color:#1E3A5F;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .o10 .arw{position:absolute;top:26px;right:24px;color:#c8ccd4;transition:.2s;font-size:18px}
  .o10 .c:hover .arw{color:#F7C600;transform:translateX(3px)}
  .o10 h4{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
  .o10 p{font-size:13.5px;color:#6B7280;line-height:1.6}
</style>
</head>
<body>
<script>
  var PLAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
  var GRID='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
  var CHAT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  var DATA=[
    {ic:PLAY,n:'01',t:'Training Videos',p:'Step-by-step walkthroughs for every workflow in the system.',b:['Full modules','Screen-recorded','Updated regularly']},
    {ic:GRID,n:'05',t:'Agency OS',p:'The all-in-one software your agency runs on.',b:['Clients, projects & billing','Replaces your stack','Claude built in']},
    {ic:CHAT,n:'04',t:'Private Community',p:'A private community of agency owners building alongside you.',b:['3,000+ members','Peer support','First access']}
  ];
  var OPTS=[
    {id:'o1',wrap:'g3',navy:false,card:d=>'<div class="c"><div class="ic">'+d.ic+'</div><span class="n">'+d.n+'</span><h4>'+d.t+'</h4><p>'+d.p+'</p><ul>'+d.b.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'},
    {id:'o2',wrap:'g3',navy:false,card:d=>'<div class="c"><span class="n">'+d.n+'</span><div class="ic">'+d.ic+'</div><h4>'+d.t+'</h4><p>'+d.p+'</p></div>'},
    {id:'o3',wrap:'g3',navy:false,card:d=>'<div class="c"><div class="ic">'+d.ic+'</div><div><h4>'+d.t+'</h4><p>'+d.p+'</p></div></div>'},
    {id:'o4',wrap:'g3',navy:true,card:d=>'<div class="c"><div class="ic">'+d.ic+'</div><h4>'+d.t+'</h4><p>'+d.p+'</p><ul>'+d.b.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'},
    {id:'o5',wrap:'g3',navy:false,card:d=>'<div class="c"><div class="ic">'+d.ic+'</div><h4>'+d.t+'</h4><p>'+d.p+'</p></div>'},
    {id:'o6',wrap:'g3',navy:false,card:d=>'<div class="c"><div class="n">'+d.n+'</div><h4>'+d.t+'</h4><p>'+d.p+'</p><ul>'+d.b.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'},
    {id:'o7',wrap:'g3',navy:false,card:d=>'<div class="c"><div class="ic">'+d.ic+'</div><h4>'+d.t+'</h4><p>'+d.p+'</p></div>'},
    {id:'o8',wrap:'g3',navy:false,card:d=>'<div class="c"><div class="ic">'+d.ic+'</div><span class="n">'+d.n+'</span><h4>'+d.t+'</h4><p>'+d.p+'</p></div>'},
    {id:'o9',wrap:'list',navy:false,card:d=>'<div class="c"><div class="ic">'+d.ic+'</div><div><h4>'+d.t+'</h4><p>'+d.p+'</p></div><span class="n">'+d.n+'</span></div>'},
    {id:'o10',wrap:'g3',navy:false,card:d=>'<div class="c"><div class="ic">'+d.ic+'</div><span class="arw">&rarr;</span><h4>'+d.t+'</h4><p>'+d.p+'</p></div>'}
  ];
  var LABELS={
    o1:['Option 1 — Yellow top accent + lift','Polished card: hover reveals a yellow top bar, subtle icon tile, check-bullets. Refined version of the current.'],
    o2:['Option 2 — Ghost number','A big faint number sits behind each card. Clean, editorial, minimal chrome.'],
    o3:['Option 3 — Horizontal (icon left)','Dark icon chip on the left, text on the right. Compact, scannable rows.'],
    o4:['Option 4 — Dark navy cards','Inverted cards on navy with yellow icons — premium, ties into the hero.'],
    o5:['Option 5 — Centered circle icon','Round yellow icon, centered content. Friendly and balanced.'],
    o6:['Option 6 — Left border + number badge','Yellow left rule and a dark number badge. Structured, checklist feel.'],
    o7:['Option 7 — Corner brackets','Yellow L-brackets frame each card — techy, matches the OS theme.'],
    o8:['Option 8 — Gradient tile + number pill','Glowing gradient icon tile and a small number pill. Product-forward.'],
    o9:['Option 9 — Minimal divider rows','No cards — clean rows with dividers. Great when there are many items.'],
    o10:['Option 10 — Elevated + arrow','White cards with a hover arrow and yellow glow border. Feels clickable.']
  };
  OPTS.forEach(function(o){
    var lab=LABELS[o.id];
    var tag=document.createElement('div');tag.className='tag';tag.innerHTML='<h3>'+lab[0]+'</h3><p>'+lab[1]+'</p>';
    document.body.appendChild(tag);
    var card=document.createElement('div');card.className='card'+(o.navy?' navy':'');
    var inner=DATA.map(o.card).join('');
    card.innerHTML='<div class="'+o.id+'"><div class="'+(o.wrap==='list'?'list':'g3')+'">'+inner+'</div></div>';
    document.body.appendChild(card);
  });
  var sp=document.createElement('div');sp.style.height='60px';document.body.appendChild(sp);
</script>
</body>
</html>
