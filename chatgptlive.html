document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e=\"display:block;width:100%;padding:20px 32px;background:#F7C600;color:#0B0E1A;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.06em;text-transform:uppercase;text-align:center;text-decoration:none;\">»&nbsp; Get In For $199!<\u002Fa>\n        <div style=\"text-align:center;margin-top:14px;font-family:'Figtree',sans-serif;font-size:13px;color:#6B7280;\">Thursday, July 9th · 2:00 PM EST · 90 minutes live<\u002Fdiv>\n        <div style=\"text-align:center;margin-top:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;color:#0B0E1A;\">Free for Blueprint Training Members<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"padding:40px 24px;background:#0B0E1A;text-align:center;\">\n  <div style=\"max-width:900px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px;\">\n    <img src=\"3c4a0d8f-d3d4-4e02-b18a-9bb8f0e8693a\" alt=\"The Blueprint Training\" style=\"height:30px;width:auto;opacity:0.8;display:block;\">\n\n    <div style=\"font-size:13px;color:rgba(255,255,255,0.35);line-height:1.5;\">© 2026 The Blueprint Training. All rights reserved. &nbsp;|&nbsp; <a href=\"#\" style=\"color:rgba(255,255,255,0.5);text-decoration:none;\">Privacy Policy<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { slide: 0, chartIn: false, p: 0 };\n  SLIDES = 4;\n  chartRef = React.createRef();\n  componentDidMount() {\n    this._t = setInterval(() => this.setState(s => ({ slide: (s.slide + 1) % this.SLIDES })), 5000);\n    const el = document.querySelector('[data-cost-chart]');\n    if (el && typeof IntersectionObserver !== 'undefined') {\n      this._io = new IntersectionObserver((entries) => {\n        if (entries.some(e => e.isIntersecting)) this.reveal();\n      }, { threshold: 0.3 });\n      this._io.observe(el);\n    }\n    // Fallback: guarantees the animation plays even where the scroll\n    // container isn't the window (e.g. embedded preview frames).\n    this._fallback = setTimeout(() => this.reveal(), 2200);\n  }\n  reveal() {\n    if (this._revealed) return;\n    this._revealed = true;\n    if (this._io) this._io.disconnect();\n    if (this._fallback) clearTimeout(this._fallback);\n    this.setState({ chartIn: true });\n    const dur = 1900, t0 = performance.now();\n    const tick = (now) => {\n      const k = Math.min(1, (now - t0) / dur);\n      this.setState({ p: k });\n      if (k < 1) this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() { clearInterval(this._t); if (this._io) this._io.disconnect(); if (this._fallback) clearTimeout(this._fallback); if (this._raf) cancelAnimationFrame(this._raf); }\n  go(n) {\n    clearInterval(this._t);\n    this.setState({ slide: (n + this.SLIDES) % this.SLIDES });\n    this._t = setInterval(() => this.setState(s => ({ slide: (s.slide + 1) % this.SLIDES })), 5000);\n  }\n  renderVals() {\n    const cur = this.state.slide;\n    const labels = ['Overview', 'Cost Trends', 'Conversions', 'Build An Ad'];\n    const tabs = labels.map((label, i) => ({\n      go: () => this.go(i),\n      num: '0' + (i + 1),\n      label,\n      bg: i === cur ? '#F7C600' : 'transparent',\n      color: i === cur ? '#0B0E1A' : 'rgba(255,255,255,0.7)',\n      border: i === cur ? '#F7C600' : 'rgba(255,255,255,0.2)',\n    }));\n    const p = this.state.p;\n    const ease = (t) => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);\n    const seg = (a, b) => ease((p - a) / (b - a));\n    const pe = ease(p);\n    const pts = [[50, 176], [150, 108], [250, 30]];\n    const prog = seg(0.5, 0.95) * 2;\n    const out = [pts[0]];\n    for (let i = 0; i < 2; i++) {\n      if (prog >= i + 1) { out.push(pts[i + 1]); }\n      else if (prog > i) { const t = prog - i, a = pts[i], b = pts[i + 1]; out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); break; }\n      else break;\n    }\n    const linePoints = out.map(pt => pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' ');\n    return {\n      bar1h: (seg(0, 0.5) * 64).toFixed(1) + 'px',\n      bar2h: (seg(0.12, 0.62) * 132).toFixed(1) + 'px',\n      bar3h: (seg(0.24, 0.74) * 210).toFixed(1) + 'px',\n      price1: '$' + (0.20 * pe).toFixed(2),\n      price2: '$' + (1.50 * pe).toFixed(2),\n      price3: '$' + (5.00 * pe).toFixed(2) + '+',\n      linePoints,\n      dot1: seg(0.6, 0.72).toFixed(3),\n      dot2: seg(0.72, 0.84).toFixed(3),\n      dot3: seg(0.84, 0.98).toFixed(3),\n      trackTransform: 'translateX(-' + (cur * 100) + '%)',\n      prev: () => this.go(cur - 1),\n      next: () => this.go(cur + 1),\n      tabs,\n      opportunity: [\n        { n: '01', title: 'Cheap clicks — but not for long', body: \"The channel's new and most agencies haven't moved yet, so you get in before the auction fills up and the prices climb.\" },\n        { n: '02', title: 'Buyers already deciding', body: 'People using ChatGPT are asking, comparing, and choosing in real time — you reach them at the exact moment they\\u2019re ready to buy, not three ads later.' },\n        { n: '03', title: 'A visible win in days, not months', body: 'Live in under an hour, signal in days. The fastest way to put a result in front of a client — and the fastest way to justify a higher retainer.' },\n        { n: '04', title: 'First-mover advantage that pays', body: \"Move now and you own the head start. Wait, and you'll pay more for the same clicks a year from now — and explain to clients why you missed it.\" },\n      ],\n      curriculum: [\n        { n: '01', title: 'The wide-open-channel advantage', body: 'Why ChatGPT Ads are cheap and convert fast right now — and exactly how many months you\\u2019ve got before that edge disappears.' },\n        { n: '02', title: 'The under-an-hour setup', body: \"The exact steps to get a client campaign live today — even if you've never run ChatGPT Ads before. No guesswork, no burned budget while you figure it out.\" },\n        { n: '03', title: 'The high-intent advantage', body: 'Why the buyers on this channel are already in decision mode — and how to put your client in front of them before your competitors even know the channel exists.' },\n        { n: '04', title: 'What to charge for it', body: 'How to package ChatGPT Ads as a premium service that raises your retainers — instead of racing to the bottom on price like everyone stuck on the old channels.' },\n        { n: '05', title: 'The mistakes that quietly burn budget', body: 'The few setup errors that kill results and make you look bad to a client — and how to avoid every one of them from day one.' },\n      ],\n      forYou: [\n        \"You run an agency (or freelance for clients) and you're tired of fighting over the same expensive clicks as everyone else.\",\n        \"You've already got clients to serve — you just want an easy, cheap way to show visible value before your next renewal call.\",\n        'You want to be early on something, for once — before every other agency catches on and the advantage is gone for good.',\n        \"You're ready to actually run this, not just bookmark it and forget it. Your clients have at least a small ad budget and you're ready to launch this week.\",\n      ],\n      notForYou: [\n        \"You're looking for a magic button with zero setup.\",\n        \"You don't have any clients (or your own offer) to run ads for yet.\",\n        'You\\u2019d rather wait until it\\u2019s \"proven\" — by which point the cheap clicks are gone and you\\u2019re paying full price like everyone else.',\n      ],\n      includes: [\n        '90-minute live workshop with Ryan, building a real ChatGPT Ads campaign via screenshare',\n        'The exact playbook to run it yourself and charge premium rates for it',\n        'A full free month of The Blueprint Training community',\n        'Replay access so you can rewatch and follow along step by step',\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
