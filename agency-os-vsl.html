ER ══ -->\n<footer style=\"background:#0B0E1A;padding:56px 24px 34px;text-align:center\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <img src=\"d3f46bc3-cff7-497f-bf35-6e81ae029ae3\" alt=\"The Blueprint Training\" style=\"height:32px;width:auto;margin:0 auto\">\n    <div style=\"margin-top:30px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:rgba(255,255,255,.4)\">\n      <p>© The Blueprint Training 2026. All rights reserved. <a href=\"/privacy-policy/\" style=\"color:rgba(255,255,255,.55);text-decoration:underline\">Privacy Policy<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- ══ EMAIL MODAL ══ -->\n<div id=\"emailModal\" style=\"display:none;position:fixed;inset:0;z-index:500;background:rgba(11,14,26,.78);align-items:center;justify-content:center;padding:24px\">\n  <div style=\"position:relative;width:100%;max-width:520px;background:#fff;border-radius:22px;padding:44px 38px 34px;box-shadow:0 46px 100px -40px rgba(0,0,0,.7)\">\n    <button type=\"button\" class=\"modal-close\" onclick=\"closeModal()\" style=\"position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:11px;border:1px solid #e6e9f0;background:#fff;color:#6b7280;font-size:22px;line-height:1;cursor:pointer\">×<\u002Fbutton>\n    <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:-.005em;line-height:1.05;font-size:30px;color:#0B0E1A;margin-bottom:22px\">Where Should We Send the Demo?<\u002Fh3>\n    <form onsubmit=\"handleSubmit(event)\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <input class=\"optin-input\" type=\"email\" id=\"optinEmail\" required=\"\" placeholder=\"Enter your email address\" style=\"width:100%;font-family:'Figtree',sans-serif;font-size:16px;color:#0B0E1A;background:#f4f6fb;border:1px solid #e6e9f0;border-radius:11px;padding:15px 16px\">\n      <button type=\"submit\" class=\"cta-yellow\" style=\"width:100%;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:19px;padding:15px 20px;border-radius:11px;border:none;cursor:pointer;background:#F7C600;color:#0B0E1A\">Watch the Demo<\u002Fbutton>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<script>\nfunction money(n){ return '$' + n.toLocaleString('en-US') + '/mo'; }\nfunction recalc(){\n  var seats = Number(document.getElementById('seats').value);\n  var total = 0;\n  document.querySelectorAll('[data-rate]').forEach(function(el){\n    var rate = Number(el.dataset.rate);\n    var amt = el.dataset.type === 'seat' ? rate * seats : rate;\n    total += amt;\n    el.textContent = money(amt);\n  });\n  document.getElementById('stackTotal').textContent = money(total);\n}\nif(document.getElementById('seats')) recalc();\n\nfunction openModal(){\n  var m = document.getElementById('emailModal');\n  m.style.display = 'flex';\n  document.body.style.overflow = 'hidden';\n}\nfunction closeModal(){\n  document.getElementById('emailModal').style.display = 'none';\n  document.body.style.overflow = '';\n}\ndocument.getElementById('emailModal').addEventListener('click', function(e){\n  if (e.target === this) closeModal();\n});\n\nfunction handleSubmit(e){\n  e.preventDefault();\n  var email = document.getElementById('optinEmail').value;\n  var btn = e.target.querySelector('button[type=submit]');\n  btn.textContent = 'Submitting...';\n  btn.disabled = true;\n  window.dataLayer = window.dataLayer || [];\n  window.dataLayer.push({ event: 'email_optin', email: email });\n  fetch('/.netlify/functions/ac-subscribe', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({ email: email })\n  })\n  .then(function(res){ return res.json(); })\n  .then(function(data){\n    if (data.success) { window.location.href = '/agency-os-demo-watch'; }\n    else { btn.textContent = 'Watch the Demo'; btn.disabled = false; alert('Something went wrong. Please try again.'); }\n  })\n  .catch(function(){ btn.textContent = 'Watch the Demo'; btn.disabled = false; alert('Something went wrong. Please try again.'); });\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
